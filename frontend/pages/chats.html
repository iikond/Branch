<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простой Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        
        #status { 
            background: #f8d7da; border-radius: 4px; 
            padding: 10px; text-align: center; margin-bottom: 10px; font-weight: bold;
        }
        
        #messages { 
            height: 400px; overflow-y: auto; background: white; 
            border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-bottom: 10px;
        }
        
        .message { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; max-width: 80%; word-wrap: break-word; }
        .message.user { background: #dcf8c6; margin-left: auto; text-align: right; }
        .message.system { background: #e9ecef; font-style: italic; display: block; margin: 10px auto; max-width: none; text-align: center;}
        
        .input-area { display: flex; gap: 8px; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0056b3; }
        
        .footer { text-align: center; margin-top: 10px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>💬 Простой WebSocket Чат</h1>
    
    <div id="status">🔴 Подключение недоступно (запустите бэкенд)</div>
    
    <div id="messages"></div>
    
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">➤</button>
    </div>
    
    <div class="footer">WebSocket: ws://localhost:8000/ws/chat</div>
</div>

<script>
    const ws = new WebSocket('ws://192.168.1.86:8000/ws/chat');
    const messagesDiv = document.getElementById('messages');
    const statusDiv = document.getElementById('status');
    const input = document.getElementById('message-input');

    ws.onopen = () => {
        console.log('✅ Подключено к WebSocket');
        statusDiv.textContent = '🟢 Подключено (ID: ' + generateUUID() + ')';
        statusDiv.style.background = '#d4edda';
        input.focus();
    };

    ws.onmessage = (event) => {
        addMessage(event.data, 'user');
        console.log('📩 Получено:', event.data);
    };

    ws.onerror = () => {
        console.error('❌ Ошибка WebSocket');
        statusDiv.textContent = '🔴 Ошибка подключения к серверу';
        statusDiv.style.background = '#f8d7da';
    };

    ws.onclose = () => {
        console.log('⚠️ Отключено (обновите страницу)');
        statusDiv.textContent = '🔴 Отключено (запустите бэкенд и обновите)';
        statusDiv.style.background = '#f8d7da';
    };

    function generateUUID() {
        return Math.random().toString(36).substring(2, 10);
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'message ' + type;
        div.textContent = text.trim();
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return alert('Не подключено!');
        
        const msg = input.value.trim();
        if (!msg) return;
        
        input.value = '';
        addMessage(msg, 'user');
        ws.send(msg);
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
